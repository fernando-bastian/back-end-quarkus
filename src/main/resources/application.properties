quarkus.datasource.db-kind=postgresql
quarkus.compose.devservices.enabled=false
%dev.quarkus.compose.devservices.enabled=true
%dev.quarkus.compose.devservices.files=docker-compose.dev.yaml
%dev.quarkus.compose.devservices.project-name=gestao-financeira-dev
%dev.quarkus.compose.devservices.start-services=true
%dev.quarkus.compose.devservices.stop-services=true
%dev.quarkus.compose.devservices.remove-volumes=false
%dev.quarkus.compose.devservices.ryuk-enabled=false
%dev.quarkus.compose.devservices.stop-timeout=10s
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
%dev.quarkus.datasource.username=${DB_USERNAME:financeiro}
%prod.quarkus.datasource.username=${DB_USERNAME:financeiro}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%test.quarkus.datasource.devservices.image-name=postgres:18-alpine
%test.quarkus.datasource.username=${TEST_DB_USERNAME:financeiro_test}
%test.quarkus.datasource.password=${TEST_DB_PASSWORD:financeiro_test}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.sql-load-script=no-file

mp.jwt.verify.issuer=gestao-financeira
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:config/public-key.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY:config/private-key.pem}
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=AUTH_TOKEN
smallrye.jwt.always-check-authorization=false
quarkus.http.auth.proactive=false
app.jwt.duration-seconds=3600
app.cookie.secure=${COOKIE_SECURE:true}
%dev.app.cookie.secure=false
%test.app.cookie.secure=false
%test.app.bootstrap.email=
%test.app.bootstrap.senha=

quarkus.rest-csrf.cookie-name=XSRF-TOKEN
quarkus.rest-csrf.cookie-path=/
quarkus.rest-csrf.cookie-http-only=false
quarkus.rest-csrf.cookie-force-secure=${app.cookie.secure}
quarkus.rest-csrf.token-header-name=X-XSRF-TOKEN
quarkus.rest-csrf.token-signature-key=${CSRF_SECRET}
%test.quarkus.rest-csrf.token-signature-key=test-only-csrf-key-at-least-32-characters
quarkus.rest-csrf.create-token-path=/api/auth/csrf

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,X-XSRF-TOKEN
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.limits.max-body-size=16K
quarkus.jackson.fail-on-unknown-properties=true
